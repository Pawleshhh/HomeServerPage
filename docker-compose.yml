version: '3.8'

services:
  home-server-page:
    build:
      context: .
      dockerfile: HomeServerPage/HomeServerPage/Dockerfile
    container_name: blazor-home-server-page
    ports:
      - "8090:8080"
    restart: always
    volumes:
      - hsp_db:/app/db
      - ${PRIVATE_DATA_PATH}:/app/data/private
      - ${NEXTCLOUD_DATA_PATH}:/app/data/nextcloud
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AppSettings__PrivateDataPath=/app/data/private
      - AppSettings__NextcloudDataPath=/app/data/nextcloud

volumes:
  hsp_db:
